<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <!-- 文言は options.js が _locales の翻訳から入れる -->
  <h1 data-i18n="extName"></h1>
  <ul class="lead">
    <li data-i18n="behaviorLivePaused"></li>
    <li data-i18n="behaviorLivePlaying"></li>
    <li data-i18n="behaviorVideo"></li>
  </ul>

  <section>
    <h2 data-i18n="shortcutHeading"></h2>
    <div class="row">
      <kbd id="current">F18</kbd>
      <button type="button" id="record" data-i18n="recordButton"></button>
      <button type="button" id="reset" class="secondary" data-i18n="resetButton"></button>
    </div>
    <p id="recording-hint" class="hint" data-i18n="recordingHint" hidden></p>
    <div class="row">
      <label for="preset" data-i18n="presetLabel"></label>
      <select id="preset">
        <option value="">-</option>
        <option>F13</option>
        <option>F14</option>
        <option>F15</option>
        <option>F16</option>
        <option>F17</option>
        <option>F18</option>
        <option>F19</option>
        <option>F20</option>
        <option>F21</option>
        <option>F22</option>
        <option>F23</option>
        <option>F24</option>
      </select>
    </div>
  </section>

  <section>
    <label class="check">
      <input type="checkbox" id="show-toast">
      <span data-i18n="showToastLabel"></span>
    </label>
  </section>

  <p id="status" class="status" role="status"></p>

  <details>
    <summary data-i18n="troubleSummary"></summary>
    <ul>
      <li data-i18n="troubleFunctionKeys"></li>
      <li data-i18n="troubleFocus"></li>
      <li data-i18n="troubleReload"></li>
      <li data-i18n="troubleAds"></li>
    </ul>
  </details>

  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
