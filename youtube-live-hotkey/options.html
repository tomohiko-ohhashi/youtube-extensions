<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <!-- 文言は options.js が _locales の翻訳から入れる -->
  <h1 data-i18n="extName"></h1>
  <ul class="lead">
    <li data-i18n="behaviorLivePaused"></li>
    <li data-i18n="behaviorLivePlaying"></li>
    <li data-i18n="behaviorVideo"></li>
  </ul>

  <section>
    <div class="section-head">
      <h2 data-i18n="shortcutHeading"></h2>
      <button type="button" id="reset" class="link" data-i18n="resetButton"></button>
    </div>
    <div id="key-box" class="key-box">
      <kbd id="current">F2</kbd>
      <span id="recording-hint" data-i18n="recordingHint" hidden></span>
    </div>
    <div class="actions">
      <button type="button" id="record" data-i18n="recordButton"></button>
      <!-- 選んだ後も「一覧から選ぶ」の表示に戻す（今のキーは上の枠に出る） -->
      <select id="preset">
        <option value="" data-i18n="presetLabel" selected hidden></option>
        <optgroup data-i18n-label="presetGroupUnused">
          <option>F2</option>
          <option>F4</option>
          <option>F8</option>
          <option>F9</option>
        </optgroup>
        <optgroup data-i18n-label="presetGroupExtra">
          <option>F13</option>
          <option>F14</option>
          <option>F15</option>
          <option>F16</option>
          <option>F17</option>
          <option>F18</option>
          <option>F19</option>
          <option>F20</option>
          <option>F21</option>
          <option>F22</option>
          <option>F23</option>
          <option>F24</option>
        </optgroup>
      </select>
    </div>
  </section>

  <section>
    <label class="check">
      <input type="checkbox" id="show-toast">
      <span data-i18n="showToastLabel"></span>
    </label>
  </section>

  <p id="status" class="status" role="status"></p>

  <details>
    <summary data-i18n="troubleSummary"></summary>
    <ul>
      <li data-i18n="troubleFunctionKeys"></li>
      <li data-i18n="troubleFocus"></li>
      <li data-i18n="troubleReload"></li>
      <li data-i18n="troubleAds"></li>
    </ul>
  </details>

  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
